services:
  - type: web
    name: product-ai-scanner
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: OPENAI_WEB_SEARCH
        value: "true"
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: EBAY_ENVIRONMENT
        value: production
      - key: EBAY_MARKETPLACE_ID
        value: EBAY_GB
      - key: APP_BASE_URL
        sync: false
